---
layout: page
---

{% include lang.html %}

<main id="project-main" class="container-fluid mt-5">
  <div class="container">
    <h1 class="page-title mb-4 text-center">Projects</h1>
    {{ content }}
  </div>
</main>

<!-- Project Modal -->
<div id="projectModal" class="modal" data-dont-diff>
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>

    <video id="modal-video" width="100%" playsinline muted controls>
      <source id="modal-video-source" src="" type="video/mp4" />
    </video>

    <img id="modal-img" src="" alt="project image" />

    <h2 id="modal-title"></h2>
    <div id="modal-desc"></div>
    <div id="modal-body" data-no-instant></div>

    <div class="modal-links">
      <a id="modal-github" class="button--winona" target="_blank">GitHub</a>
      <a id="modal-demo" class="button--winona" target="_blank">Live Demo</a>
    </div>
  </div>
</div>

<link rel="stylesheet" href="{{ '/assets/css/projects.css' | relative_url }}" />
<script src="{{ '/assets/js/projects.js' | relative_url }}"></script>
